buildscript {
    ext {
        springBootVersion = '1.5.4.RELEASE'
    }
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
//        classpath("org.sonarsource.scanner.gradle:sonarqube-gradle-plugin:2.7.1")
    }
}

plugins {
    id 'application'
    id 'jacoco'
    id "org.sonarqube" version "2.7.1"
}

application {
    mainClassName = 'com.mukul.user.mgm.application.Application' // Set this correctly
}

jacoco {
    toolVersion = "0.8.10" // Ensure this is the latest
}

sonarqube {
    properties {
        property "sonar.projectKey", "AI-Test"
        property "sonar.organization", "AI-Test"  // Only needed for SonarCloud
        property "sonar.host.url", "http://localhost:9000" // Adjust if using a different server
        property "sonar.token", "sqp_aeec44b498380835c636f59cf1c5d58de67af57b" // Required if authentication is enabled
        property "sonar.coverage.jacoco.xmlReportPaths", "${buildDir}/reports/jacoco/test/jacocoTestReport.xml"
    }
}

group 'com.mukul'
version '1.0-SNAPSHOT'

apply plugin: 'idea'
apply plugin: 'groovy'
apply plugin: 'java'
apply plugin: 'spring-boot'
//apply plugin: 'org.sonarqube'

sourceCompatibility = 11
targetCompatibility = 11

repositories {
    mavenCentral()
}

dependencies {
    compile('org.springframework.boot:spring-boot-starter-actuator')
    compile('org.springframework.boot:spring-boot-starter-data-jpa')
    compile('org.springframework.boot:spring-boot-starter-data-rest')
    compile('org.springframework.data:spring-data-rest-hal-browser')
    compile('org.springframework.boot:spring-boot-starter-hateoas')
    compile('org.projectlombok:lombok:1.16.6')
    compile('org.springframework.boot:spring-boot-starter-web')
    compile('org.springframework.boot:spring-boot-starter-logging')
    implementation 'org.aspectj:aspectjweaver:1.9.7'

    compile('org.hibernate:hibernate-core:4.3.11.Final')
    compile('org.hibernate:hibernate-entitymanager:4.3.11.Final')
    compile('org.hibernate:hibernate-validator:5.2.4.Final')
    compile('com.h2database:h2:1.4.191')

    compile('org.jasypt:jasypt:1.9.2')
    compile('org.jasypt:jasypt-hibernate4:1.9.2')
    compile('org.bouncycastle:bcprov-jdk15on:1.54')

    implementation 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
    testImplementation 'org.projectlombok:lombok:1.18.30'

//    // JUnit 5 (Jupiter API and Engine)
//    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
//    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
//
//    // Mockito for unit testing
//    testImplementation 'org.mockito:mockito-core:5.5.0'

    // JUnit 5 (Jupiter API and Engine)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'

    // Mockito Core
    testImplementation 'org.mockito:mockito-core:5.5.0'

    // Mockito JUnit 5 Extension
    testImplementation 'org.mockito:mockito-junit-jupiter:5.5.0'

    testCompile('org.hibernate:hibernate-testing:5.1.0.Final')
    testCompile('org.springframework.boot:spring-boot-starter-test')
    testCompile('org.codehaus.groovy:groovy-all:2.5.14')
    testCompile('junit:junit:4.13.1')
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport // Generate report after tests run
}

jacocoTestReport {
    dependsOn test

    reports {
        xml.enabled true // Required for SonarQube
        csv.enabled false
        html.enabled true // Optional, human-readable report
    }
}